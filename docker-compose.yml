services:
  backend:
    build: .
    image: capote-voice-backend
    container_name: capote-voice
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
