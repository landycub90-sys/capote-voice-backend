services:
  backend:
    # Imagen construida y publicada por GitHub Actions (ver .github/workflows/docker.yml).
    # Docker Manager hace `pull`, así que descarga SIEMPRE la última construida desde GitHub.
    image: ghcr.io/landycub90-sys/capote-voice-backend:latest
    pull_policy: always
    container_name: capote-voice
    restart: unless-stopped
    environment:
      PORT: "8080"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI}
      OAUTH_SCOPES: ${OAUTH_SCOPES}
      SERVICE_ACCOUNT_CLIENT_ID: ${SERVICE_ACCOUNT_CLIENT_ID}
      SERVICE_ACCOUNT_CLIENT_SECRET: ${SERVICE_ACCOUNT_CLIENT_SECRET}
      INTERMEDIA_AUTH_URL: ${INTERMEDIA_AUTH_URL}
      INTERMEDIA_TOKEN_URL: ${INTERMEDIA_TOKEN_URL}
      INTERMEDIA_API_BASE: ${INTERMEDIA_API_BASE}
      APP_REDIRECT_SCHEME: ${APP_REDIRECT_SCHEME}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      SERVICE_SCOPES: ${SERVICE_SCOPES}
      DEVICE_ID: ${DEVICE_ID}
    ports:
      - "127.0.0.1:8080:8080"

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    network_mode: host
    # HTTPS automático sin Caddyfile: proxy del dominio al backend local
    command: caddy reverse-proxy --from voice-api.capotesolutions.com --to 127.0.0.1:8080
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
